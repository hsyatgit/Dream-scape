name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble, unit test, and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamscape-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Signed release builds are disabled. This job never runs until the `if`
  # condition is edited. Do not commit a keystore.
  #
  # To enable a signed release when a version tag is pushed:
  #   1. Create a PKCS12 or JKS keystore locally.
  #   2. Add repository Actions secrets (Settings → Secrets and variables → Actions):
  #        KEYSTORE_BASE64      base64 of the keystore file (no newlines required)
  #        KEYSTORE_PASSWORD    store password
  #        KEY_ALIAS            key alias
  #        KEY_PASSWORD         key password
  #   3. Replace the line `if: ${{ false }}` below with:
  #        if: startsWith(github.ref, 'refs/tags/v')
  #   4. Push a tag such as v0.1.0.
  #
  # The release APK is signed from those secrets at build time. The keystore
  # never enters git.
  signed-release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore from secret
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Assemble signed release
        env:
          DREAMSCAPE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          DREAMSCAPE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DREAMSCAPE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DREAMSCAPE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dreamscape-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
